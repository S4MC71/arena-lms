<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Arena Web Security LMS</title>
  <meta name="description" content="Secure login to Arena Web Security Virtual Classroom Portal">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background: radial-gradient(circle at 50% 30%, #0F172A 0%, #030712 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

<div style="max-width: 480px; width: 100%;">

  <!-- Brand Header -->
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="brand-logo" style="width: 60px; height: 60px; font-size: 2rem; margin: 0 auto 12px; border-radius: 14px;">🛡️</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #FFF, #9CA3AF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
      ARENA WEB SECURITY
    </h1>
    <p style="color: var(--primary); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px;">
      Virtual Classroom & LMS Portal
    </p>
  </div>

  <!-- Login Form Card -->
  <div class="glass-card" style="padding: 28px;">
    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">

      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="user@arena.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
      </div>

      <div id="login-error-msg" style="display:none; color:var(--rose); font-size:0.82rem; margin-bottom:14px; font-weight:600; padding: 8px 12px; background: rgba(244,63,94,0.1); border-radius: 6px; border: 1px solid rgba(244,63,94,0.3);"></div>

      <button type="submit" id="btn-login" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;">
        🔒 Secure Login to Portal
      </button>

    </form>

    <!-- Demo Accounts Quick Fill -->
    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--bg-card-border);">
      <span style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-dim); font-weight: 700; display: block; margin-bottom: 10px; text-align: center; letter-spacing: 1px;">
        Quick Login (Development & Testing)
      </span>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <button type="button" class="btn btn-outline btn-sm" id="btn-s1" onclick="fillAndLogin('student1@arena.com','pass123')" style="justify-content: space-between;">
          <span>🎓 Student 1 — Batch 1 (Web Security)</span>
          <span style="color: var(--cyan); font-family: var(--font-mono); font-size:0.75rem;">student1@arena.com</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="btn-s2" onclick="fillAndLogin('student2@arena.com','pass123')" style="justify-content: space-between;">
          <span>🎓 Student 2 — Batch 2 (API Security)</span>
          <span style="color: var(--cyan); font-family: var(--font-mono); font-size:0.75rem;">student2@arena.com</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="btn-s3" onclick="fillAndLogin('student3@arena.com','pass123')" style="justify-content: space-between;">
          <span>🎓 Student 3 — Batch 3 (SOC)</span>
          <span style="color: var(--cyan); font-family: var(--font-mono); font-size:0.75rem;">student3@arena.com</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="btn-s4" onclick="fillAndLogin('student4@arena.com','pass123')" style="justify-content: space-between;">
          <span>🎓 Student 4 — Batch 4 (Cloud Security)</span>
          <span style="color: var(--cyan); font-family: var(--font-mono); font-size:0.75rem;">student4@arena.com</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="btn-tch" onclick="fillAndLogin('teacher@arena.com','pass123')" style="justify-content: space-between; border-color: rgba(6,182,212,0.4);">
          <span>👨‍🏫 Teacher — Rahat Chowdhury</span>
          <span style="color: var(--cyan); font-family: var(--font-mono); font-size:0.75rem;">teacher@arena.com</span>
        </button>
        <button type="button" class="btn btn-outline btn-sm" id="btn-aud" onclick="fillAndLogin('auditor@arena.com','pass123')" style="justify-content: space-between; border-color: rgba(139,92,246,0.4);">
          <span>🛡️ Auditor — Super Admin</span>
          <span style="color: var(--purple); font-family: var(--font-mono); font-size:0.75rem;">auditor@arena.com</span>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  // Dynamic API URL: works on localhost AND on Vercel
  const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:4000/api'
    : '/api';

  function fillAndLogin(email, pass) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = pass;
    const fakeEvent = { preventDefault: () => {} };
    handleLogin(fakeEvent);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error-msg');
    const btn = document.getElementById('btn-login');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '🔄 Authenticating...';

    try {
      const res = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!data.success) {
        errorEl.textContent = data.error || 'Invalid credentials. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = '🔒 Secure Login to Portal';
        return;
      }

      localStorage.setItem('arena_token', data.token);
      localStorage.setItem('arena_user', JSON.stringify(data.user));

      const redirectMap = {
        student: 'student.html',
        teacher: 'teacher.html',
        auditor: 'auditor.html'
      };

      window.location.href = redirectMap[data.user.role] || 'student.html';

    } catch (err) {
      errorEl.textContent = '⚠️ Cannot connect to server. Make sure the API is running.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '🔒 Secure Login to Portal';
    }
  }
</script>
</body>
</html>
